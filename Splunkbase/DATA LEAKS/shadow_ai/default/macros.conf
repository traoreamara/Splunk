# Indexes holding AI / proxy / web traffic. Adjust per environment.
[ai_indexes]
definition = (index=proxy OR index=web OR index=main)
iseval = 0

# Web traffic to an AI service (CIM web tag + lookup). Call with a leading pipe: | `ai_web`
# actor = authenticated user when available, otherwise source IP (proxy without auth).
[ai_web]
definition = search `ai_indexes` tag=web | lookup ai_services_lookup domain AS dest OUTPUT service AS ai_service vendor AS ai_vendor category AS ai_category sanctioned AS ai_sanctioned risk AS ai_risk | eval actor=coalesce(user,src)
iseval = 0

# DNS resolution to an AI service.  | `ai_dns`
[ai_dns]
definition = search `ai_indexes` tag=dns | lookup ai_services_lookup domain AS query OUTPUT service AS ai_service vendor AS ai_vendor category AS ai_category sanctioned AS ai_sanctioned risk AS ai_risk | eval actor=coalesce(src,user)
iseval = 0

# Upload size (bytes) treated as a potential data leak.
[ai_upload_threshold]
definition = 1048576
iseval = 0

# Base risk score per lookup risk level.
[ai_risk_base(1)]
args = riskfield
definition = case($riskfield$=="high",80, $riskfield$=="medium",50, $riskfield$=="low",20, 1==1,30)
iseval = 0

