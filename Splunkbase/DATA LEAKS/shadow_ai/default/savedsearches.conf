# Shadow AI detections. Notables on 1-4 ; RBA (index=risk) on 6.
# actor = authenticated user when available, otherwise source IP.

[Shadow AI - Unsanctioned AI service usage]
search = | `ai_web` | search ai_service=* ai_sanctioned=false | stats count sum(bytes_out) AS bytes_out values(ai_service) AS ai_service values(ai_vendor) AS ai_vendor values(dest) AS dest by actor
dispatch.earliest_time = -1h
cron_schedule = 15 * * * *
enableSched = 1
alert.severity = 3
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
action.notable = 1
action.correlationsearch.annotations = {"mitre_attack":["T1567","T1567.002"],"analytic_story":["Shadow AI"]}
action.notable.param.rule_title = Shadow AI - Unsanctioned AI service usage
action.notable.param.rule_description = $actor$ used unsanctioned AI service(s) $ai_service$ ($ai_vendor$).
action.notable.param.security_domain = audit
action.notable.param.severity = medium
action.notable.param.default_status = 1
action.notable.param.default_owner = unassigned
action.notable.param.nes_fields = actor,dest,ai_service,ai_vendor,bytes_out
action.notable.param.drilldown_name = View AI traffic for $actor$
action.notable.param.drilldown_search = | `ai_web` | search ai_service=* actor="$actor$"

[Shadow AI - Large upload to AI service]
search = | `ai_web` | search ai_service=* | stats sum(bytes_out) AS bytes_out values(ai_service) AS ai_service values(dest) AS dest by actor | where bytes_out > `ai_upload_threshold` | eval mb=round(bytes_out/1048576,2) | sort - bytes_out
dispatch.earliest_time = -1h
cron_schedule = 20 * * * *
enableSched = 1
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
action.notable = 1
action.correlationsearch.annotations = {"mitre_attack":["T1567","T1567.002","T1048"],"analytic_story":["Shadow AI"]}
action.notable.param.rule_title = Shadow AI - Large upload to AI service
action.notable.param.rule_description = $actor$ uploaded $mb$ MB to $ai_service$ (potential data leak).
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.default_status = 1
action.notable.param.nes_fields = actor,dest,ai_service,bytes_out,mb
action.notable.param.drilldown_name = Upload details for $actor$
action.notable.param.drilldown_search = | `ai_web` | search ai_service=* actor="$actor$"

[Shadow AI - New AI service first seen]
search = | `ai_web` | search ai_service=* | stats earliest(_time) AS first_seen count by ai_service ai_vendor | where first_seen > relative_time(now(), "-1d@d") | eval dest=ai_service
dispatch.earliest_time = -1d
cron_schedule = 30 6 * * *
enableSched = 1
alert.severity = 2
action.notable = 1
action.correlationsearch.annotations = {"mitre_attack":["T1567"],"analytic_story":["Shadow AI"]}
action.notable.param.rule_title = Shadow AI - New AI service first seen
action.notable.param.rule_description = New AI service $ai_service$ ($ai_vendor$) observed for the first time.
action.notable.param.security_domain = audit
action.notable.param.severity = low
action.notable.param.default_status = 1
action.notable.param.nes_fields = ai_service,ai_vendor

[Shadow AI - Usage spike per user]
search = | `ai_web` | search ai_service=* | bucket _time span=1d | stats sum(bytes_out) AS bytes_out by _time actor | eventstats avg(bytes_out) AS avg stdev(bytes_out) AS stdev by actor | where bytes_out > (avg + 3*stdev) AND _time >= relative_time(now(),"-1d@d") | eval mb=round(bytes_out/1048576,2)
dispatch.earliest_time = -8d
cron_schedule = 40 6 * * *
enableSched = 1
alert.severity = 3
action.notable = 1
action.correlationsearch.annotations = {"mitre_attack":["T1567","T1020"],"analytic_story":["Shadow AI"]}
action.notable.param.rule_title = Shadow AI - Unusual AI usage spike
action.notable.param.rule_description = Abnormal AI volume for $actor$ : $mb$ MB over the day.
action.notable.param.security_domain = threat
action.notable.param.severity = medium
action.notable.param.default_status = 1
action.notable.param.nes_fields = actor,bytes_out,mb

[Shadow AI - DNS lookups to AI services]
search = | `ai_dns` | search ai_service=* | stats count values(ai_service) AS ai_service by actor
dispatch.earliest_time = -1h
cron_schedule = 25 * * * *
enableSched = 1
alert.severity = 2

[Shadow AI - Risk scoring per user]
search = | `ai_web` | search ai_service=* | eval risk_base=`ai_risk_base(ai_risk)` | eval up_factor=min(round((bytes_out/`ai_upload_threshold`)*20,0),40) | eval sanct_factor=if(ai_sanctioned="true",0,10) | eval event_risk=min(risk_base+up_factor+sanct_factor,100) | stats sum(event_risk) AS risk_score sum(bytes_out) AS bytes_out values(ai_service) AS ai_service dc(ai_service) AS nb_services by actor | rename actor AS risk_object | eval risk_object_type="user", source="Shadow AI", search_name="Shadow AI - Risk scoring per user" | where risk_score > 100 | collect index=risk
dispatch.earliest_time = -1h
cron_schedule = 50 * * * *
enableSched = 1
alert.severity = 3
description = Aggregates a Shadow AI risk score per actor into index=risk (RBA). Requires an index named risk.
