[Windows Firewall - Excessive Blocked Outbound Connections]
description = A host keeps trying to reach the Internet and keeps being denied. Frequently the first visible trace of malware looking for its C2.
search = `wfo_traffic` action=blocked direction=outbound dest_scope=external `ip_whitelist` | stats count AS blocked_attempts, dc(dest_ip) AS distinct_destinations, dc(dest_port) AS distinct_ports, values(dest_service) AS services BY host | where blocked_attempts >= 500 AND distinct_destinations >= 20 | eval severity="high", signature="Host repeatedly denied outbound to the Internet" | sort - blocked_attempts
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search
cron_schedule = 6 * * * *
alert.severity = 4
alert.suppress.period = 3600s
alert.suppress.fields = host

[Windows Firewall - Possible C2 Beaconing]
description = Outbound connections to a fixed external address at a near constant interval. Low jitter is the signature of automated callbacks.
search = `wfo_traffic` action=allowed direction=outbound dest_scope=external `ip_whitelist` | sort 0 host dest_ip _time | streamstats current=f last(_time) AS previous_time BY host, dest_ip | eval interval = _time - previous_time | where isnotnull(interval) AND interval > 5 | stats count AS connections, avg(interval) AS avg_interval, stdev(interval) AS stdev_interval, dc(dest_port) AS distinct_ports, values(dest_port) AS dest_port, sum(bytes_out) AS bytes_out BY host, dest_ip | where connections >= 20 AND avg_interval >= 30 AND stdev_interval < (avg_interval * 0.15) | eval jitter_ratio = round(stdev_interval / avg_interval, 3), avg_interval = round(avg_interval, 1), severity="high", signature="Regular interval outbound traffic (beaconing)" | table host dest_ip dest_port connections avg_interval jitter_ratio bytes_out signature severity | sort + jitter_ratio
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search
cron_schedule = 27 */4 * * *
alert.severity = 4
alert.suppress.period = 14400s
alert.suppress.fields = host

