[Windows Firewall - Configuration Change History]
description = Full audit trail of firewall configuration and policy changes.
search = `wfo_changes` NOT EventID IN (2010,2011,2012) | lookup windows_firewall_event_id EventID OUTPUT Description | eval Description = coalesce(setting_name, Description) | table _time Computer EventID Description result action change_type RuleName rule_action direction Protocol ApplicationPath ModifyingApplication ModifyingUser Profiles LocalPorts RemotePorts LocalAddresses RemoteAddresses | sort - _time
dispatch.earliest_time = -7d@h
dispatch.latest_time = now
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search

[Windows Firewall - Firewall Status By Host]
description = Current on/off state of Windows Defender Firewall per host, based on the last recorded change.
search = `wfo_changes` EventID IN (2003,2082,2083) SettingType=1 | eval firewall_state = if(SettingValue="01000000", "enabled", "disabled") | stats latest(_time) AS last_change, latest(firewall_state) AS firewall_state, latest(Profiles) AS firewall_profile BY Computer | eval last_change = strftime(last_change, "%Y-%m-%d %H:%M:%S") | sort firewall_state, Computer
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search

[Windows Firewall - Data Collection Health]
description = Which hosts are shipping firewall data, how much and how recently. Start here when a dashboard looks empty.
search = | tstats count AS events, latest(_time) AS last_seen WHERE index IN `windows_firewall_index` sourcetype="windows:pfirewall" BY host, index | eval minutes_since = round((now() - last_seen)/60, 1), last_seen = strftime(last_seen, "%Y-%m-%d %H:%M:%S"), status = case(minutes_since < 60, "healthy", minutes_since < 1440, "delayed", true(), "stale") | sort status, - minutes_since
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search


