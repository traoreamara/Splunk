[Windows Firewall - LOLBin With Network Activity]
description = A signed Windows binary that normally has no business talking to the Internet did. Tune out your legitimate management tooling first.
search = `wfo_wfp` process_name IN ("powershell.exe","pwsh.exe","cscript.exe","wscript.exe","mshta.exe","rundll32.exe","regsvr32.exe","certutil.exe","bitsadmin.exe","installutil.exe","msbuild.exe","odbcconf.exe","forfiles.exe") dest_scope=external | stats count AS connections, dc(dest_ip) AS destinations, values(dest_ip) AS dest_ip, values(dest_port) AS dest_port, values(action) AS action, values(process_path) AS process_path BY host, process_name | eval severity="high", signature="Living-off-the-land binary reached an external address" | sort - connections
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
