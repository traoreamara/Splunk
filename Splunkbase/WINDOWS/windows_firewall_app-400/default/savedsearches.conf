[Windows Firewall - Host Stopped Sending Firewall Logs]
description = A host that used to ship pfirewall.log went quiet. Either the forwarder, the logging setting or the host itself is down.
search = | tstats latest(_time) AS last_seen WHERE index IN `windows_firewall_index` sourcetype="windows:pfirewall" BY host | eval hours_since = round((now() - last_seen) / 3600, 1), last_seen = strftime(last_seen, "%Y-%m-%d %H:%M:%S") | where hours_since >= 24 | eval severity="medium", signature="No firewall traffic log received for 24h or more" | sort - hours_since
