[Windows Firewall - Profile Disabled Or Inbound Allow (Posture)]
description = Current state, independent of whether Splunk ever saw the change event. This is the detection that catches hosts that were already misconfigured on day one.
search = `wfo_posture_profiles` | stats latest(_time) AS _time, latest(enabled) AS enabled, latest(default_inbound_action) AS default_inbound_action, latest(findings) AS findings BY Computer, profile | where enabled!="true" OR default_inbound_action="allow" | eval severity="critical", signature="Host is currently unprotected" | table Computer profile enabled default_inbound_action findings signature severity | sort Computer
dispatch.earliest_time = -2h@h
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search
cron_schedule = 33 * * * *
alert.severity = 5
alert.suppress.period = 21600s
alert.suppress.fields = host

[Windows Firewall - Risky Inbound Rule Inventoried]
description = Rules that allow inbound traffic from any address, on an administrative port, or without binding to an application.
search = `wfo_posture_rules` severity IN ("critical","high") risks!="-" | stats latest(_time) AS _time, latest(risks) AS risks, latest(severity) AS severity, latest(local_port) AS local_port, latest(remote_address) AS remote_address, latest(program) AS program, latest(policy_source) AS policy_source BY Computer, rule_name | eval signature="Inbound allow rule open to any source, any port or with no application binding" | table Computer severity rule_name local_port remote_address program policy_source risks signature | sort severity, Computer
dispatch.earliest_time = -25h@h
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search
cron_schedule = 47 4 * * *
alert.severity = 4
alert.suppress.period = 86400s
alert.suppress.fields = host

[Windows Firewall - Posture Compliance Report]
description = Compliance rate per firewall profile, for reporting.
search = `wfo_posture_profiles` | stats latest(compliant) AS compliant, latest(enabled) AS enabled, latest(log_blocked) AS log_blocked, latest(default_inbound_action) AS default_inbound_action, latest(findings) AS findings BY Computer, profile | eventstats dc(Computer) AS total_hosts | stats dc(Computer) AS hosts, dc(eval(if(compliant!="true", Computer, null()))) AS with_findings, max(total_hosts) AS total_hosts BY profile | eval compliance_pct = round((hosts - with_findings)*100/hosts, 1) | table profile hosts with_findings compliance_pct
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search

