##############################################################################
# Microsoft Windows Firewall Observability - savedsearches.conf
#
# All alerts ship DISABLED (enableSched = 0). Review the thresholds, then
# enable the ones relevant to your environment from
# Settings > Searches, reports and alerts.
##############################################################################

[Windows Firewall - Firewall Disabled On Host]
description = Someone (or something) turned Windows Defender Firewall off on a monitored host. One of the highest value signals of this app.
search = `wfo_changes` EventID IN (2003,2082,2083) SettingType=1 SettingValue="00000000" | stats latest(_time) AS _time, values(Profiles) AS firewall_profile, values(ModifyingApplication) AS ModifyingApplication, values(ModifyingUser) AS user, count BY Computer | eval severity="critical", signature="Windows Defender Firewall was turned off" | table _time Computer firewall_profile user ModifyingApplication count signature severity
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
alert.track = 1
alert.digest_mode = 1
alert.suppress = 1
counttype = number of events
relation = greater than
quantity = 0
enableSched = 0
disabled = 0
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = windows_firewall_app
request.ui_dispatch_view = search
cron_schedule = 8 * * * *
alert.severity = 5
alert.suppress.period = 3600s
alert.suppress.fields = host

