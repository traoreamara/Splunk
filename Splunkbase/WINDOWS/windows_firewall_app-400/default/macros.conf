##############################################################################
# Microsoft Windows Firewall Observability - macros.conf
##############################################################################

# ---------------------------------------------------------------------------
# Set by the app setup page. Contains the index(es) receiving the Windows
# Defender Firewall data, e.g. (windows_firewall) or (win*, wineventlog).
# ---------------------------------------------------------------------------
[windows_firewall_index]
definition = (*)
iseval = 0

# ---------------------------------------------------------------------------
# Base searches. Use these instead of retyping the index / sourcetype filter.
# ---------------------------------------------------------------------------
[wfo_traffic]
definition = index IN `windows_firewall_index` sourcetype="windows:pfirewall"
iseval = 0

[wfo_changes]
definition = index IN `windows_firewall_index` source="*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall"
iseval = 0

# ---------------------------------------------------------------------------
# Noise reduction. Removes every event whose source OR destination belongs to
# a range declared in lookups/whitelist_ip_ranges.csv. Enrich that file to
# silence your own trusted networks.
# ---------------------------------------------------------------------------
[ip_whitelist]
definition = | lookup whitelistipranges ip_range AS src_ip OUTPUT ip_range as wl_src_ip_range | lookup whitelistipranges ip_range AS dest_ip OUTPUT ip_range as wl_dest_ip_range | where isnull(wl_src_ip_range) AND isnull(wl_dest_ip_range) | fields - wl_src_ip_range wl_dest_ip_range
iseval = 0

# ---------------------------------------------------------------------------
# Helper used inside eval / where to test whether an address is RFC1918.
# Usage: | eval scope = if(`wfo_internal_ip(dest_ip)`, "internal", "external")
# ---------------------------------------------------------------------------
[wfo_internal_ip(1)]
args = ip
definition = (cidrmatch("10.0.0.0/8", $ip$) OR cidrmatch("172.16.0.0/12", $ip$) OR cidrmatch("192.168.0.0/16", $ip$) OR cidrmatch("169.254.0.0/16", $ip$) OR cidrmatch("127.0.0.0/8", $ip$))
iseval = 0

# ---------------------------------------------------------------------------
# Backward compatibility with version 2.x. Deprecated - do not use in new
# searches.
# ---------------------------------------------------------------------------
[windows_pfirewall_index]
definition = `windows_firewall_index`
iseval = 0

# ---------------------------------------------------------------------------
# Windows Filtering Platform (Security channel) - process attribution.
#
# pfirewall.log tells you that an address was contacted. WFP audit events tell
# you WHICH BINARY did it. Most estates already collect the Security channel
# through Splunk_TA_windows, so these macros normalise it in SPL instead of
# claiming props on the shared XmlWinEventLog:Security sourcetype.
#
# Set wfo_wfp_index to the index holding your Security events - it is usually
# NOT the same one as the firewall traffic log.
# ---------------------------------------------------------------------------
[wfo_wfp_index]
definition = (*)
iseval = 0

[wfo_wfp_base]
definition = index IN `wfo_wfp_index` (sourcetype="XmlWinEventLog:Security" OR sourcetype="WinEventLog:Security") (EventCode IN (5031,5152,5154,5155,5156,5157,5158,5159) OR EventID IN (5031,5152,5154,5155,5156,5157,5158,5159))
iseval = 0

[wfo_wfp]
definition = `wfo_wfp_base` | eval event_id = coalesce(EventCode, EventID) | eval action = case(event_id IN ("5156","5154","5158"), "allowed", event_id IN ("5031","5152","5153","5155","5157","5159"), "blocked", true(), "unknown"), wfp_operation = case(event_id="5156","connection allowed", event_id="5157","connection blocked", event_id="5152","packet dropped", event_id="5154","listen allowed", event_id="5155","listen blocked", event_id="5158","bind allowed", event_id="5159","bind blocked", event_id="5031","inbound accept blocked", true(), "other"), direction = case(Direction IN ("%%14592","Inbound","inbound"), "inbound", Direction IN ("%%14593","Outbound","outbound"), "outbound", true(), "unknown"), transport = case(Protocol="6","tcp", Protocol="17","udp", Protocol="1","icmp", Protocol="2","igmp", Protocol="47","gre", Protocol="50","esp", Protocol="58","icmpv6", true(), "unknown") | eval src_ip = coalesce(SourceAddress, src_ip), dest_ip = coalesce(DestAddress, dest_ip), src_port = coalesce(SourcePort, src_port), dest_port = coalesce(DestPort, dest_port), process_path = coalesce(Application, ApplicationPath), process_id = coalesce(ProcessID, process_id), host = coalesce(host, Computer) | rex field=process_path "(?<process_name>[^\x5c/]+)$" | eval process_name = lower(coalesce(process_name, "unknown")) | eval dest_scope = if(`wfo_internal_ip(dest_ip)`, "internal", "external"), src_scope = if(`wfo_internal_ip(src_ip)`, "internal", "external") | lookup wfo_network_services port AS dest_port protocol AS transport OUTPUT service AS dest_service
iseval = 0

# Unified flow view: pfirewall.log plus WFP, sharing the same field names.
# Expensive - use it only when you really need both sources at once.
[wfo_network]
definition = search (`wfo_traffic`) OR (`wfo_wfp_base`) | eval telemetry = if(sourcetype="windows:pfirewall", "pfirewall", "wfp")
iseval = 0

# ---------------------------------------------------------------------------
# Data model acceleration switch.
#
# Ships as summariesonly=false, which works whether or not the
# Windows_Firewall_Observability data model is accelerated. Once you enable
# acceleration, set this macro to `summariesonly=true allow_old_summaries=true`
# to force every dashboard onto the summaries.
# ---------------------------------------------------------------------------
[wfo_summariesonly]
definition = summariesonly=false
iseval = 0

# Root of the shipped data model, so views never hard-code the name.
[wfo_datamodel]
definition = datamodel=Windows_Firewall_Observability.Traffic
iseval = 0

# ---------------------------------------------------------------------------
# Firewall posture, collected by the companion TA-windows-firewall-posture.
# ---------------------------------------------------------------------------
[wfo_posture_profiles]
definition = index IN `windows_firewall_index` sourcetype="windows:firewall:profile"
iseval = 0

[wfo_posture_rules]
definition = index IN `windows_firewall_index` sourcetype="windows:firewall:rule"
iseval = 0
