##############################################################################
# Microsoft Windows Firewall Observability - datamodels.conf
#
# Acceleration ships DISABLED: it costs disk and indexer CPU, and that choice
# belongs to you, not to the app.
#
# To turn it on:
#   Settings > Data models > Windows Firewall Observability > Edit >
#   Edit acceleration > tick Accelerate, pick a summary range.
#
# Then set the `wfo_summariesonly` macro to
#   summariesonly=true allow_old_summaries=true
# so every dashboard reads the summaries only. Until you do, the dashboards
# run with summariesonly=false and work exactly as before, just slower.
##############################################################################

[Windows_Firewall_Observability]
acceleration = 0
acceleration.earliest_time = -7d
acceleration.max_time = 3600
acceleration.poll_buckets_until_maxtime = true
acceleration.backfill_time =
acceleration.max_concurrent = 2
