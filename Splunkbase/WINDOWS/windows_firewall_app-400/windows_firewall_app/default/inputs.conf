##############################################################################
# Microsoft Windows Firewall Observability - inputs.conf
#
# Deploy this file (or its content) on every Windows host / universal
# forwarder that must ship Windows Defender Firewall data.
#
# IMPORTANT: replace "windows_firewall" below by the index used in your
# environment, and declare the very same index in the app setup page on the
# search head (it feeds the `windows_firewall_index` macro).
##############################################################################

# ---------------------------------------------------------------------------
# 1. Connection log (pfirewall.log)
# ---------------------------------------------------------------------------
# initCrcLength is raised on purpose: the 4 header lines of pfirewall.log are
# identical after every rotation (pfirewall.log -> pfirewall.log.old). With the
# default 256 bytes Splunk computes the same CRC for the new file and silently
# resumes at the previous offset, which loses events. Reading 2048 bytes makes
# the CRC include real traffic lines, so a rotated file is correctly detected
# as new.
[monitor://C:\Windows\System32\LogFiles\Firewall\pfirewall.log]
disabled = 0
index = windows_firewall
sourcetype = windows:pfirewall
initCrcLength = 2048
followTail = 0

# Some hardened GPOs write one log file per profile. Enable if needed.
[monitor://C:\Windows\System32\LogFiles\Firewall\domainfw.log]
disabled = 1
index = windows_firewall
sourcetype = windows:pfirewall
initCrcLength = 2048

[monitor://C:\Windows\System32\LogFiles\Firewall\privatefw.log]
disabled = 1
index = windows_firewall
sourcetype = windows:pfirewall
initCrcLength = 2048

[monitor://C:\Windows\System32\LogFiles\Firewall\publicfw.log]
disabled = 1
index = windows_firewall
sourcetype = windows:pfirewall
initCrcLength = 2048

# ---------------------------------------------------------------------------
# 2. Firewall configuration / policy changes (Windows Event Log)
# ---------------------------------------------------------------------------
# renderXml = 1 keeps every field of the event and is required by
# Splunk_TA_windows for the field extractions this app relies on.
[WinEventLog://Microsoft-Windows-Windows Firewall With Advanced Security/Firewall]
disabled = 0
renderXml = 1
index = windows_firewall
current_only = 0
start_from = oldest
checkpointInterval = 5
# Resolve SIDs to account names. Without this, ModifyingUser arrives as a raw
# SID (S-1-5-21-...) and every "who changed the firewall" panel is unreadable.
# Splunk enables it by default on the Security channel only, so it has to be
# set explicitly here. This channel is low volume by nature - it produces an
# event only when the firewall configuration changes - so the directory
# lookups cost nothing. Use evt_dc_name / evt_dns_name to pin a specific
# domain controller if resolution is slow or unreliable.
evt_resolve_ad_obj = 1

# Optional: IPsec / connection security rule changes.
[WinEventLog://Microsoft-Windows-Windows Firewall With Advanced Security/ConnectionSecurity]
disabled = 1
renderXml = 1
index = windows_firewall
current_only = 0
checkpointInterval = 5
evt_resolve_ad_obj = 1

# Optional: Filtering Platform audit (5152/5156/5157). Very verbose - only
# enable it when you specifically need per-process network audit.
[WinEventLog://Security]
disabled = 1
renderXml = 1
index = windows_firewall
whitelist = 5025,5031,5152,5153,5154,5155,5156,5157,5158,5159,4950,4946,4947,4948
