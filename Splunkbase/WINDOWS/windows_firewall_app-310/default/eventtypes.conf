##############################################################################
# Microsoft Windows Firewall Observability - eventtypes.conf
##############################################################################

[windows_firewall_traffic]
search = sourcetype="windows:pfirewall"
#tags = network communicate
color = et_blue

[windows_firewall_change]
search = source="*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall"
color = et_orange

[windows_firewall_setting_change]
search = source="*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall" EventID IN (2003,2082,2083,2013,4950)
color = et_orange

[windows_firewall_rule_change]
search = source="*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall" EventID IN (2004,2005,2006,2052,2084,2097,2099,4946,4947,4948)
color = et_red

[windows_firewall_service_status]
search = source="*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall" EventID IN (2007,2008,5025)
color = et_purple

# ---------------------------------------------------------------------------
# Windows Filtering Platform audit events (Security channel). These carry the
# process attribution that pfirewall.log lacks.
# ---------------------------------------------------------------------------
[windows_firewall_wfp_connection]
search = (sourcetype="XmlWinEventLog:Security" OR sourcetype="WinEventLog:Security") (EventCode IN (5156,5157) OR EventID IN (5156,5157))
color = et_green

[windows_firewall_wfp_listen]
search = (sourcetype="XmlWinEventLog:Security" OR sourcetype="WinEventLog:Security") (EventCode IN (5154,5155,5158,5159,5031) OR EventID IN (5154,5155,5158,5159,5031))
color = et_purple

# ---------------------------------------------------------------------------
# Firewall posture inventory, collected by TA-windows-firewall-posture.
# ---------------------------------------------------------------------------
[windows_firewall_posture_profile]
search = sourcetype="windows:firewall:profile"
color = et_blue

[windows_firewall_posture_rule]
search = sourcetype="windows:firewall:rule"
color = et_blue
