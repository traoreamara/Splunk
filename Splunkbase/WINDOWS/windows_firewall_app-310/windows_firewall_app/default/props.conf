##############################################################################
# Microsoft Windows Firewall Observability - props.conf
#
# CIM: Network Traffic (traffic log) and Change (Windows Event Log)
##############################################################################

###############################################################
# 1. Connection log - sourcetype windows:pfirewall
###############################################################
[windows:pfirewall]
# --- Index time -----------------------------------------------------------
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 2000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
ANNOTATE_PUNCT = false
category = Network & Security
description = Microsoft Windows Defender Firewall connection log (pfirewall.log)
pulldown_type = 1
TRANSFORMS-wfo_drop_headers = wfo_pfirewall_header_nullqueue

# --- Field extraction -----------------------------------------------------
REPORT-Network_Traffic = REPORT-Network_Traffic

# --- Aliases --------------------------------------------------------------
FIELDALIAS-src = src_ip ASNEW src
FIELDALIAS-dest = dest_ip ASNEW dest
FIELDALIAS-dvc = host ASNEW dvc host ASNEW dvc_host host ASNEW dvc_name

# --- Normalisation (CIM Network Traffic) ----------------------------------
EVAL-action = case(action=="ALLOW","allowed", action=="DROP","blocked", true(),"unknown")
EVAL-src_port = if(src_port=="-", null(), tonumber(src_port))
EVAL-dest_port = if(dest_port=="-", null(), tonumber(dest_port))
EVAL-bytes = if(bytes=="-" OR isnull(bytes), 0, tonumber(bytes))
EVAL-bytes_in = if(info=="RECEIVE", coalesce(tonumber(bytes),0), 0)
EVAL-bytes_out = if(info=="SEND", coalesce(tonumber(bytes),0), 0)
EVAL-packets_in = if(info=="RECEIVE", 1, 0)
EVAL-packets_out = if(info=="SEND", 1, 0)
EVAL-direction = case(info=="RECEIVE","inbound", info=="SEND","outbound", true(),"unknown")
EVAL-transport = case(transport=="-" OR isnull(transport),"unknown", true(), lower(transport))
EVAL-protocol = if(match(coalesce(src_ip,""), ":"), "ipv6", "ip")
EVAL-protocol_version = if(match(coalesce(src_ip,""), ":"), "ipv6", "ipv4")
EVAL-ip_version = if(match(coalesce(src_ip,""), ":"), 6, 4)
EVAL-app = "windows-defender-firewall"
EVAL-rule = "unknown"
EVAL-user = "unknown"
EVAL-duration = 0
EVAL-vendor = "Microsoft"
EVAL-product = "Windows Defender Firewall"
EVAL-vendor_product = "Microsoft Windows Defender Firewall"
EVAL-vendor_account = "unknown"
EVAL-dest_interface = "unknown"
EVAL-dest_zone = "unknown"
EVAL-src_zone = "unknown"
EVAL-dvc_zone = "unknown"
EVAL-icmp_type = if(icmp_type=="-", null(), icmp_type)
EVAL-icmp_code = if(icmp_code=="-", null(), icmp_code)
EVAL-process_id = if(isnull(process_id) OR process_id=="-", null(), process_id)
EVAL-session_id = if(isnull(process_id) OR process_id=="-", "unknown", process_id)
# Internal / external scope of the remote peer - used by the hunting views.
EVAL-src_scope = if(cidrmatch("10.0.0.0/8",src_ip) OR cidrmatch("172.16.0.0/12",src_ip) OR cidrmatch("192.168.0.0/16",src_ip) OR cidrmatch("169.254.0.0/16",src_ip) OR cidrmatch("127.0.0.0/8",src_ip), "internal", "external")
EVAL-dest_scope = if(cidrmatch("10.0.0.0/8",dest_ip) OR cidrmatch("172.16.0.0/12",dest_ip) OR cidrmatch("192.168.0.0/16",dest_ip) OR cidrmatch("169.254.0.0/16",dest_ip) OR cidrmatch("127.0.0.0/8",dest_ip), "internal", "external")
# Structural noise: loopback, link-local, multicast, broadcast and reserved ranges.
# Exposed as a data model field so tstats based panels can filter it out - a
# search-time lookup such as `ip_whitelist` cannot be used inside tstats.
EVAL-is_noise = if(cidrmatch("127.0.0.0/8",src_ip) OR cidrmatch("127.0.0.0/8",dest_ip) OR cidrmatch("169.254.0.0/16",src_ip) OR cidrmatch("169.254.0.0/16",dest_ip) OR cidrmatch("224.0.0.0/4",dest_ip) OR cidrmatch("240.0.0.0/4",dest_ip) OR dest_ip=="255.255.255.255" OR src_ip=="0.0.0.0" OR match(lower(coalesce(dest_ip,"")),"^(ff|fe80)") OR match(lower(coalesce(src_ip,"")),"^fe80"), 1, 0)

# --- Enrichment -----------------------------------------------------------
LOOKUP-wfo_dest_service = wfo_network_services port AS dest_port protocol AS transport OUTPUT service AS dest_service service_description AS dest_service_description


###############################################################
# 2. Firewall configuration changes - Windows Event Log
###############################################################
[source::*WinEventLog:Microsoft-Windows-Windows Firewall With Advanced Security/Firewall]
# --- Aliases --------------------------------------------------------------
FIELDALIAS-dest = Computer ASNEW dest
FIELDALIAS-dvc = Computer ASNEW dvc Computer ASNEW dvc_host
FIELDALIAS-user = ModifyingUser ASNEW user ModifyingUser ASNEW src_user
FIELDALIAS-command = ModifyingApplication ASNEW command
FIELDALIAS-rule = RuleName ASNEW rule

# --- Vendor ---------------------------------------------------------------
EVAL-vendor = "Microsoft"
EVAL-product = "Windows Defender Firewall"
EVAL-vendor_product = "Microsoft Windows Defender Firewall"

# --- Human readable decoding ---------------------------------------------
EVAL-Protocol = case(Protocol=="0","HOPOPT", Protocol=="1","ICMP", Protocol=="2","IGMP", Protocol=="6","TCP", Protocol=="17","UDP", Protocol=="41","IPv6", Protocol=="47","GRE", Protocol=="50","ESP", Protocol=="51","AH", Protocol=="58","ICMPv6", Protocol=="89","OSPF", Protocol=="132","SCTP", Protocol=="253" OR Protocol=="254","Reserved", Protocol=="255","Reserved", Protocol=="256","Any", true(), Protocol)
EVAL-Profiles = case(Profiles=="1","Domain", Profiles=="2","Private", Profiles=="3","Domain, Private", Profiles=="4","Public", Profiles=="5","Domain, Public", Profiles=="6","Private, Public", Profiles=="7","All", Profiles=="2147483647","All", Profiles=="2147483649","None", true(), Profiles)
EVAL-NewProfile = case(NewProfile=="1","Domain", NewProfile=="2","Private", NewProfile=="3","Domain, Private", NewProfile=="4","Public", NewProfile=="5","Domain, Public", NewProfile=="6","Private, Public", NewProfile=="7","All", NewProfile=="2147483647","All", NewProfile=="2147483649","None", true(), NewProfile)
EVAL-OldProfile = case(OldProfile=="1","Domain", OldProfile=="2","Private", OldProfile=="3","Domain, Private", OldProfile=="4","Public", OldProfile=="5","Domain, Public", OldProfile=="6","Private, Public", OldProfile=="7","All", OldProfile=="2147483647","All", OldProfile=="2147483649","None", true(), OldProfile)
EVAL-direction = case(Direction=="1","inbound", Direction=="2","outbound", Direction=="0","outbound", true(),"unknown")
EVAL-rule_action = case(Action=="2","blocked", Action=="3","allowed", true(),"unknown")
EVAL-src_ip_range = case(Direction=="1", RemoteAddresses, Direction=="0" OR Direction=="2", LocalAddresses, true(), null())
EVAL-dest_ip_range = case(Direction=="1", LocalAddresses, Direction=="0" OR Direction=="2", RemoteAddresses, true(), null())
EVAL-src_port_range = case(Direction=="1", RemotePorts, Direction=="0" OR Direction=="2", LocalPorts, true(), null())
EVAL-dest_port_range = case(Direction=="1", LocalPorts, Direction=="0" OR Direction=="2", RemotePorts, true(), null())

# --- Normalisation (CIM Change) ------------------------------------------
# action must stay within the CIM allowed set: created / modified / deleted /
# read / updated. The richer human readable value lives in `result`.
EVAL-action = case(EventID IN ("2004","2097","2084"),"created", EventID IN ("2006","2052"),"deleted", EventID IN ("2005","2099","2003","2082","2083","2010","2013","4950"),"modified", true(),"modified")
EVAL-change_type = case(EventID IN ("2003","2082","2083","2013","2010","4950"),"firewall-setting", EventID IN ("2004","2005","2006","2052","2084","2097","2099"),"firewall-policy", EventID IN ("2007","2008","2011","2012","5031","5025"),"firewall-service", true(),"firewall-other")
EVAL-object_category = "firewall"
EVAL-setting_name = case(SettingType=="1","Enable Windows Defender Firewall", SettingType=="2","Current Profile", SettingType=="3","Windows Defender Firewall Shielded Mode", SettingType=="5","Log Dropped Packets", SettingType=="6","Log Successful Connections", SettingType=="8","Maximum Log File Size", SettingType=="9","Log File Path", SettingType=="16","Default Outbound Action", SettingType=="17","Default Inbound Action", true(), null())
EVAL-object = coalesce(RuleName, setting_name, "Windows Defender Firewall")
EVAL-object_attrs = if(isnull(RuleName), coalesce(setting_name,"setting"), "rule")
EVAL-object_path = coalesce(ApplicationPath, ModifyingApplication, "unknown")
EVAL-status = case(EventID=="2007","success", EventID=="2008","failure", Active=="1","active", Active=="0","inactive", SettingType=="1" AND SettingValue=="01000000","active", SettingType=="1" AND SettingValue=="00000000","inactive", true(), null())
EVAL-firewall_enabled = case(SettingType=="1" AND SettingValue=="01000000","enabled", SettingType=="1" AND SettingValue=="00000000","disabled", true(), null())
EVAL-default_inbound_action = case(SettingType=="17" AND SettingValue=="01000000","block", SettingType=="17" AND SettingValue=="00000000","allow", true(), null())
EVAL-default_outbound_action = case(SettingType=="16" AND SettingValue=="01000000","block", SettingType=="16" AND SettingValue=="00000000","allow", true(), null())
EVAL-result = case(EventID IN ("2004","2097") AND Action=="2","created:block", EventID IN ("2004","2097") AND Action=="3","created:allow", EventID IN ("2005","2099") AND Action=="2","modified:block", EventID IN ("2005","2099") AND Action=="3","modified:allow", EventID IN ("2006","2052"),"deleted", EventID=="2084","duplicated", EventID=="2013","firewall reset to defaults", EventID=="2007","service started", EventID=="2008","service stopped", SettingType=="1" AND SettingValue=="01000000","firewall enabled", SettingType=="1" AND SettingValue=="00000000","firewall disabled", SettingType=="17" AND SettingValue=="00000000","default inbound: allow", SettingType=="17" AND SettingValue=="01000000","default inbound: block", SettingType=="16" AND SettingValue=="00000000","default outbound: allow", SettingType=="16" AND SettingValue=="01000000","default outbound: block", true(),"setting changed")
EVAL-severity = case(EventID=="2008","high", EventID=="2013","high", SettingType=="1" AND SettingValue=="00000000","critical", SettingType=="17" AND SettingValue=="00000000","critical", EventID IN ("2004","2097") AND Action=="3" AND Direction=="1","high", EventID IN ("2006","2052"),"medium", true(),"informational")

# --- Enrichment -----------------------------------------------------------
LOOKUP-wfo_event_description = windows_firewall_event_id EventID OUTPUT Description AS event_description
