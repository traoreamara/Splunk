##############################################################################
# Microsoft Windows Firewall Observability - transforms.conf
##############################################################################

# ---------------------------------------------------------------------------
# Index-time: drop the W3C header lines of pfirewall.log (#Version, #Software,
# #Time Format, #Fields) and blank lines. They carry no value and pollute the
# statistics of every dashboard.
# ---------------------------------------------------------------------------
[wfo_pfirewall_header_nullqueue]
REGEX = ^\s*(?:#|$)
DEST_KEY = queue
FORMAT = nullQueue

# ---------------------------------------------------------------------------
# Search-time: pfirewall.log field extraction.
#
# Replaces the previous positional DELIMS extraction, which silently produced
# shifted fields on hosts whose log format has 17 columns (no process id,
# Windows Server 2016 / 2019) instead of 18 (Windows 10/11, Server 2022+).
# The last group is optional, so both layouts are handled.
#
# W3C columns:
#  date time action protocol src-ip dst-ip src-port dst-port size tcpflags
#  tcpsyn tcpack tcpwin icmptype icmpcode info path [pid]
# ---------------------------------------------------------------------------
[REPORT-Network_Traffic]
REGEX = ^(?<date>\d{4}-\d{2}-\d{2})\s+(?<hour>\d{2}:\d{2}:\d{2})\s+(?<action>\S+)\s+(?<transport>\S+)\s+(?<src_ip>\S+)\s+(?<dest_ip>\S+)\s+(?<src_port>\S+)\s+(?<dest_port>\S+)\s+(?<bytes>\S+)\s+(?<tcp_flag>\S+)\s+(?<tcp_syn>\S+)\s+(?<tcp_ack>\S+)\s+(?<tcp_windows_size>\S+)\s+(?<icmp_type>\S+)\s+(?<icmp_code>\S+)\s+(?<packet_info>\S+)\s+(?<info>\S+)(?:\s+(?<process_id>\S+))?\s*$

# Backward compatible alias of the previous stanza name.
[windows_pfirewall_fields]
REGEX = ^(?<date>\d{4}-\d{2}-\d{2})\s+(?<hour>\d{2}:\d{2}:\d{2})\s+(?<action>\S+)\s+(?<transport>\S+)\s+(?<src_ip>\S+)\s+(?<dest_ip>\S+)\s+(?<src_port>\S+)\s+(?<dest_port>\S+)\s+(?<bytes>\S+)\s+(?<tcp_flag>\S+)\s+(?<tcp_syn>\S+)\s+(?<tcp_ack>\S+)\s+(?<tcp_windows_size>\S+)\s+(?<icmp_type>\S+)\s+(?<icmp_code>\S+)\s+(?<packet_info>\S+)\s+(?<info>\S+)(?:\s+(?<process_id>\S+))?\s*$

# ---------------------------------------------------------------------------
# Lookup definitions
# ---------------------------------------------------------------------------
[whitelistipranges]
batch_index_query = 0
case_sensitive_match = 1
filename = whitelist_ip_ranges.csv
match_type = CIDR(ip_range)

[windows_firewall_event_id]
batch_index_query = 0
case_sensitive_match = 0
filename = windows_firewall_event_id.csv

[wfo_network_services]
batch_index_query = 0
case_sensitive_match = 0
filename = wfo_network_services.csv

[wfo_ip_protocol]
batch_index_query = 0
case_sensitive_match = 0
filename = wfo_ip_protocol.csv
