# Parsing of the Squid "ai" logformat and full CIM Web compliance.
# logformat ai : %ts.%03tu %>a %un %Ss/%03>Hs %>st %<st %rm %ru
[squid:ai]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 18
category = Web
pulldown_type = 1

# Raw fields from the access log
EXTRACT-squid_ai = ^\d+\.\d+\s+(?<src>\S+)\s+(?<user_raw>\S+)\s+(?<cache_result>[^/\s]+)/(?<status>\d+)\s+(?<bytes_out>\d+)\s+(?<bytes_in>\d+)\s+(?<http_method>\S+)\s+(?<raw_url>\S+)

# ---- CIM Web fields ----
# user : null when no proxy auth ("-")
EVAL-user = if(user_raw="-",null(),user_raw)
# dest / site : destination host (strip :port, e.g. host:443 -> host)
EVAL-dest = if(match(raw_url,"://"),replace(raw_url,"^\w+://([^/:]+).*$","\1"),replace(raw_url,":\d+$",""))
EVAL-site = if(match(raw_url,"://"),replace(raw_url,"^\w+://([^/:]+).*$","\1"),replace(raw_url,":\d+$",""))
EVAL-dest_port = case(match(raw_url,"://[^/]+:\d+"),tonumber(replace(raw_url,"^\w+://[^/]+:(\d+).*$","\1")),match(raw_url,"^[^/]+:\d+$"),tonumber(replace(raw_url,"^.*:(\d+)$","\1")),match(raw_url,"^https"),443,match(raw_url,"^http://"),80,1==1,443)
# url / url_length : for CONNECT, url is host:port
EVAL-url = raw_url
EVAL-url_length = len(raw_url)
# transport volumes (CIM: bytes_out = sent by host = upload, bytes = total)
EVAL-bytes = bytes_in + bytes_out
# action : CIM allowed/blocked from HTTP status
EVAL-action = case(status>=200 AND status<400,"allowed", status>=400,"blocked", 1==1,"unknown")
# status_description for readability
EVAL-status_description = cache_result
# identity / product
EVAL-src_ip = if(match(src,"^\d{1,3}(\.\d{1,3}){3}$"),src,null())
EVAL-app = "squid"
EVAL-vendor_product = "Squid Proxy"
